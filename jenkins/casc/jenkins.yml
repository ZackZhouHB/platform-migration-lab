jenkins:
  systemMessage: |
    Platform Migration Lab - Jenkins Controller
    This Jenkins instance is part of a CI/CD migration lab.
    We are migrating these pipelines to GitHub Actions.
  
  numExecutors: 2
  mode: NORMAL
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  globalNodeProperties:
    - envVars:
        env:
          - key: "LAB_ENV"
            value: "migration-lab"

unclassified:
  location:
    url: http://localhost:8080/
  
  # Shared libraries will be configured manually via Jenkins UI
  # or via job DSL after initial startup. The filesystem SCM
  # retriever requires additional plugins not in the base install.
